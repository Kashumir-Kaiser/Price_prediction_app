version: "3.9"
services:
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/1
      ENVIRONMENT: test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
    restart: "no"

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
    restart: "no"

  scraper-test:
    build:
      context: ./scraper
      dockerfile: Dockerfile
      target: test          
    env_file: .env
    environment:
      # Pass env vars that might be needed by tests (if any).
      # The test infrastructure uses testcontainers, not the compose services.
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256m