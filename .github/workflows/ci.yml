name: Full CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run contract + integration + e2e nightly
    - cron: '0 2 * * *'

env:
  IMAGE_TAG: ${{ github.sha }}
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:

  # ───────────────────────── Unit Tests ─────────────────────────

  backend-unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: market_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rust/market_features
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install maturin
          cd rust/market_features
          maturin develop --release
          cd ../..
      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/market_db_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          pytest tests/unit -v --cov=app --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run vitest
        run: cd frontend && npx vitest run --reporter=verbose
      - name: Build
        run: cd frontend && npm run build

  scraper-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install dependencies
        run: cd scraper && go mod tidy
      - name: Run Go unit tests
        run: cd scraper && go test ./internal/... -v -coverprofile=coverage.out
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: scraper/coverage.out
          fail_ci_if_error: false

  # ───────────────────────── Contract Tests ─────────────────────────

  contract-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install pytest pact-python httpx
      - name: Run contract tests
        run: cd backend && pytest contracts/pact-consumer/tests -v
      - name: Upload Pact contracts
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: backend/contracts/pact-consumer/tests/pacts/

  contract-provider:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: market_db_test
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install pytest pact-python httpx
      - name: Download Pact contracts
        uses: actions/download-artifact@v4
        with:
          name: pacts
          path: backend/contracts/pact-provider/tests/pacts/
      - name: Run provider verification
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/market_db_test
        run: cd backend && pytest contracts/pact-provider/tests -v

  # ───────────────────────── Integration Tests ─────────────────────────

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: market_db_test
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/market_db_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: cd backend && pytest tests/integration -v

  # ───────────────────────── E2E Tests ─────────────────────────

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          cd e2e
          npm install
          npx playwright install chromium
      - name: Build & start stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml up --abort-on-container-exit backend-test scraper-test frontend-test
          sleep 30
      - name: Run E2E tests
        run: cd e2e && npx playwright test
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  # ───────────────────────── Load Tests ─────────────────────────

  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --abort-on-container-exit backend-test scraper-test frontend-test
      - name: Run k6
        run: |
          docker run --rm --network host             -v $(pwd)/load-tests:/tests             grafana/k6:latest run /tests/api_smoke.js
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  # ───────────────────────── Chaos Tests ─────────────────────────

  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --abort-on-container-exit backend-test scraper-test frontend-test
      - name: Install toxiproxy & run chaos
        run: |
          docker run --rm --network host ghcr.io/shopify/toxiproxy-cli:latest             toxic add -t latency -a latency=500 -d toxiproxy:8474 backend
          cd tests/chaos
          ./test_chaos.sh
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  # ───────────────────────── Docker Build & Security ─────────────────────────

  build-push:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit, scraper-unit, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push scraper
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scraper/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/scraper:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/backend:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-backend.sarif'
      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-frontend.sarif'
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
