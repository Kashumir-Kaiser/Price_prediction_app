[package]
name = "market_features"
version = "0.1.0"
edition = "2021"

[lib]
name = "market_features"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
polars = { version = "0.39", features = ["lazy", "rolling_window", "dtype-full"] }
ndarray = "0.15"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
